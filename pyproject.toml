[project]
name = "final-checker"
version = "0.1.0"
description = "Pluggable API key checker — auto-detects Gemini/OpenAI/Anthropic keys and probes liveness + tier/rate-limit grade"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-auth>=2.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
final-checker = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.plugins"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
