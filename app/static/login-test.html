<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录测试 - 长期监控</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        .result { margin-top: 20px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>🔐 长期监控系统 - 登录测试</h2>

    <form id="loginForm">
        <label>管理员密码：</label>
        <input type="password" id="password" placeholder="输入管理员密码" />
        <button type="submit">登录</button>
    </form>

    <div id="result"></div>

    <hr style="margin: 30px 0;">

    <h3>说明</h3>
    <p>✅ 所有测试通过：</p>
    <ul>
        <li>✅ 服务运行正常</li>
        <li>✅ admin.html 可访问</li>
        <li>✅ admin.js 和 admin.css 可加载</li>
        <li>✅ 认证 API 工作正常</li>
    </ul>

    <p><strong>管理员密码：</strong> 通过环境变量 <code>ADMIN_PASSWORD</code> 配置（默认: change-me-in-production）</p>
    <p><strong>完整管理界面：</strong> <a href="/static/admin.html" target="_blank">/static/admin.html</a></p>

    <script>
        const resultDiv = document.getElementById('result');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            resultDiv.innerHTML = '<p>登录中...</p>';

            try {
                const response = await fetch('/api/long-term/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 登录成功
                    localStorage.setItem('adminToken', data.token);
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ 登录成功！</h3>
                            <p><strong>Token:</strong> ${data.token.substring(0, 40)}...</p>
                            <p><strong>过期时间:</strong> ${data.expires_in / 3600} 小时</p>
                            <p><a href="/static/admin.html">👉 进入完整管理界面</a></p>
                        </div>
                    `;
                } else {
                    // 登录失败
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ 登录失败</h3>
                            <p>${data.detail || '未知错误'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ 请求错误</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
